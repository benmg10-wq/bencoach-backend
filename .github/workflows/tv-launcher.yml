name: Build TV launcher

on:
  push:
    paths:
      - 'tv-toolkit/launcher/**'
      - '.github/workflows/tv-launcher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: tv-toolkit/launcher
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tv-launcher-apk
          path: tv-toolkit/launcher/app/build/outputs/apk/debug/app-debug.apk
      - name: Commit APK into the repo
        run: |
          cp tv-toolkit/launcher/app/build/outputs/apk/debug/app-debug.apk tv-toolkit/tv-launcher.apk
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add tv-toolkit/tv-launcher.apk
          git diff --cached --quiet || (git commit -m "Update built TV launcher APK" && git push)
