name: Build TV launcher

on:
  push:
    paths:
      - 'tv-toolkit/launcher/**'
      - '.github/workflows/tv-launcher.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: tv-toolkit/launcher
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tv-launcher-apk
          path: tv-toolkit/launcher/app/build/outputs/apk/debug/app-debug.apk
