plugins {
    id 'com.android.application'
}

android {
    namespace 'com.benmg.tvlauncher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.benmg.tvlauncher'
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
